name: update-stars

on:
  workflow_dispatch:   # 仅手动触发

permissions:
  contents: write
  pages: write

concurrency:
  group: update-stars
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and commit docs/stars.json
        id: commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          # retry on push races (e.g. a push-triggered run and a manual run at the same time)
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            python3 scripts/build_data.py
            git add docs/stars.json data/uncurated.json
            if git diff --cached --quiet; then echo "No changes."; exit 0; fi
            git commit -m "chore: 更新 Star 数据 $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "push rejected, retrying ($attempt)"; sleep $((attempt * 10))
          done
          exit 1
      - name: Request Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed (push should still trigger a build)"
