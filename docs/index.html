<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Star 收藏夹 · laoshuterry</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="分类">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/>
        </svg>
      </div>
      <div><b>Star 收藏夹</b><small id="user">@laoshuterry</small></div>
    </div>
    <h6>分类</h6>
    <nav class="cats" id="cats"></nav>
    <div class="side-foot"><span id="upd"></span><span id="categoryCount"></span></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menu" aria-expanded="false"
        aria-controls="side" aria-label="打开分类">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round">
          <path d="M4 6h16M4 12h16M4 18h10"/>
        </svg>
      </button>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="q" aria-label="搜索仓库" type="search"
          placeholder="搜索仓库名、中文简介或标签…" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="spacer"></div>
      <a class="gh" href="https://github.com/laoshuterry?tab=stars" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38v-1.34c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 014 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>GitHub
      </a>
      <button class="icon-btn" id="theme" aria-label="切换深浅色"></button>
    </header>
    <section class="content">
      <div class="head">
        <div><h1 id="title">全部</h1><p id="sub"></p></div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="bar">
        <div class="seg" id="sort">
          <button data-k="starred">Star 时间</button>
          <button data-k="stars">Star 数</button>
          <button data-k="pushed">最近更新</button>
        </div>
        <label class="chk"><input type="checkbox" id="hideStale">隐藏不活跃</label>
        <span class="result" id="result"></span>
      </div>
      <div class="mresult" id="mresult"></div>
      <div class="grid" id="grid" aria-live="polite">
        <div class="empty-st loading-state">正在加载数据…</div>
        <noscript>
          <style>.loading-state { display: none; }</style>
          <div class="empty-st">
            <b>请启用 JavaScript</b>
            此页面需要 JavaScript 才能加载收藏数据，请启用后刷新页面。
          </div>
        </noscript>
      </div>
      <button class="more" id="more" hidden>加载更多</button>
      <footer class="data-footer" id="dataFooter"></footer>
    </section>
  </main>
</div>
<script src="./js/boot.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
