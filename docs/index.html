<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Star 分类索引 · 页面建设中</title>
<style>body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#222}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #eee;padding:6px 8px;text-align:left}td.n{text-align:right}
.muted{color:#888;font-size:14px}#err{color:#c00}</style></head>
<body>
<h1>🚧 页面建设中</h1>
<p>FatMouse 的 GitHub Star 分类索引。正式页面正在设计中，这是数据加载测试页。</p>
<p id="summary" class="muted">正在加载 stars.json…</p>
<p id="err"></p>
<table id="cats" hidden><thead><tr><th>分类</th><th class="n">数量</th></tr></thead><tbody></tbody></table>
<script>
fetch('./stars.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{
  document.getElementById('summary').textContent=`共 ${d.total} 个仓库，${d.categories.length} 个分类；数据生成于 ${d.generated_at}`;
  const tb=document.querySelector('#cats tbody');
  d.categories.forEach(c=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${c.name_zh}</td><td class="n">${c.count}</td>`;tb.appendChild(tr)});
  document.getElementById('cats').hidden=false;
}).catch(e=>{document.getElementById('err').textContent='数据加载失败：'+e.message});
</script>
</body></html>
